<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tambah Data - Sistem Toko Handphone</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .container { background-color: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { color: #333; margin-top: 0; }
        label { font-weight: bold; color: #555; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; padding: 12px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; font-size: 16px;}
        button:hover { background-color: #004494; }
        .btn-kembali { display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none; }
        .btn-kembali:hover { color: #333; }
    </style>
    <script>
        // JavaScript untuk mengatur penampilan input secara dinamis
        function sesuaikanForm() {
            var jenis = document.getElementById("jenis").value;
            var divJaringan = document.getElementById("div-jaringan");
            var divOs = document.getElementById("div-os");
            var divRam = document.getElementById("div-ram");

            // Sembunyikan semua terlebih dahulu
            divJaringan.style.display = "none";
            divOs.style.display = "none";
            divRam.style.display = "none";

            // Tampilkan berdasarkan pilihan jenis handphone
            if (jenis === "FeaturePhone") {
                divJaringan.style.display = "block";
            } else if (jenis === "Smartphone") {
                divOs.style.display = "block";
            } else if (jenis === "SmartphoneGaming") {
                divOs.style.display = "block";
                divRam.style.display = "block";
            }
        }
        // Jalankan fungsi saat halaman pertama kali dimuat
        window.onload = sesuaikanForm;
    </script>
</head>
<body>

<div class="container">
    <h2>Tambah Handphone Baru</h2>

    <form action="/simpan" method="POST">
        <label>Merk:</label>
        <input type="text" name="merk" required placeholder="Contoh: Xiaomi">

        <label>Nama Handphone:</label>
        <input type="text" name="nama" required placeholder="Contoh: Redmi Note 13">

        <label>Harga (Rp):</label>
        <input type="number" name="harga" min="0" required placeholder="Contoh: 3000000">

        <label>Jenis Handphone (Inheritance):</label>
        <select name="jenis" id="jenis" onchange="sesuaikanForm()">
            <option value="FeaturePhone">Feature Phone</option>
            <option value="Smartphone" selected>Smartphone</option>
            <option value="SmartphoneGaming">Smartphone Gaming</option>
        </select>

        <div id="div-jaringan">
            <label>Tipe Jaringan:</label>
            <input type="text" name="tipeJaringan" placeholder="Contoh: 4G LTE / 5G">
        </div>

        <div id="div-os">
            <label>Sistem Operasi (OS):</label>
            <input type="text" name="sistemOperasi" placeholder="Contoh: Android 14 / iOS 17">
        </div>

        <div id="div-ram">
            <label>Kapasitas RAM (GB):</label>
            <input type="number" name="kapasitasRAM" min="0" value="0">
        </div>

        <button type="submit">Simpan Data</button>
    </form>

    <a href="/" class="btn-kembali">← Batal dan Kembali ke Beranda</a>
</div>

</body>
</html>
